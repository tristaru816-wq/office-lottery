<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>点击测试</title>
</head>
<body style="font-family:sans-serif;padding:24px;background:#fff;">
<p style="font-size:18px;">点击测试</p>
<input id="box" type="text" placeholder="点这里打字" style="font-size:18px;padding:14px;width:100%;box-sizing:border-box;">
<p><button type="button" onclick="document.getElementById('msg').textContent='按钮可以点'" style="font-size:18px;padding:14px 20px;margin-top:12px;">点这个按钮</button></p>
<p id="msg" style="font-size:18px;color:#A94064;"></p>
</body>
</html>
